<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#1C2B33; --muted:#5A6A70;
  --line:#CBD5D1; --sage:#3F6B57; --sage-soft:#DCE8E1; --gold:#9A7322; --gold-soft:#F3E9D2;
  --rust:#A2432F; --rust-soft:#F5DFD8; --focus:#2F6FB0;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C1F; --surface:#1D272B; --sunk:#172024; --ink:#E4ECE8; --muted:#9AABA6;
    --line:#33434A; --sage:#7FB79B; --sage-soft:#22382E; --gold:#D8B262; --gold-soft:#3A3120;
    --rust:#E58C76; --rust-soft:#432A24; --focus:#7DB2EA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141C1F; --surface:#1D272B; --sunk:#172024; --ink:#E4ECE8; --muted:#9AABA6;
  --line:#33434A; --sage:#7FB79B; --sage-soft:#22382E; --gold:#D8B262; --gold-soft:#3A3120;
  --rust:#E58C76; --rust-soft:#432A24; --focus:#7DB2EA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:650;margin:0;line-height:1.2}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
header.top .sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.btn.warn{background:var(--rust);border-color:var(--rust);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sage);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=tel],input[type=number],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.search{margin-bottom:14px}

/* the flock list: the one memorable element is the care ring */
.flock{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.flock li{border-bottom:1px solid var(--line)}
.flock button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 4px;cursor:pointer}
.flock button:focus-visible{outline:2px solid var(--focus)}
.ring{width:52px;height:52px;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:650;font-size:1rem}
.who{min-width:0}
.who strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .meta{font-size:.85rem;color:var(--muted)}
.tag{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--sage-soft);color:var(--sage)}
.tag.due{background:var(--gold-soft);color:var(--gold)}
.tag.late{background:var(--rust-soft);color:var(--rust)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel h3{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--sunk);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--serif);font-size:1.25rem}
.stats span{font-size:.8rem;color:var(--muted)}
.timeline{list-style:none;margin:8px 0 0;padding:0}
.timeline li{padding:10px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-size:.8rem;color:var(--muted)}
.timeline p{margin:2px 0 0;white-space:pre-wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--sage)}
.empty{padding:28px 6px;text-align:left;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--serif);font-size:1.1rem;margin-bottom:4px}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:12px}
.back{margin:-6px 0 10px -8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 2px 12px;font-size:.78rem;color:var(--muted);position:relative}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--sage);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--rust);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px;line-height:16px}

dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,20,24,.5)}
dialog form{padding:20px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.flag{border-left:4px solid var(--gold);padding:12px 12px 12px 14px;background:var(--surface);border-radius:0 12px 12px 0;margin-top:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.flag.urgent{border-left-color:var(--rust)}
.flag.resolved{border-left-color:var(--sage);opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:8px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--sage);color:var(--surface)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.cel{list-style:none;margin:0;padding:0}
.cel li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cel li:first-child{border-top:0}
.cel .when{font-size:.82rem;color:var(--gold);font-weight:600}
.hh{padding:12px 0;border-top:1px solid var(--line)}
.hh:first-of-type{border-top:0}
.hh .bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.hh .bar i{display:block;height:100%;background:var(--sage)}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.stats.four{grid-template-columns:repeat(4,1fr)}}
select.lang{width:auto;padding:6px 8px;font-size:.88rem}
.auth{max-width:420px;margin:8vh auto 0}
.auth h1{font-size:2rem;margin-bottom:6px}
.auth .panel{margin-top:20px}
.err{color:var(--rust);font-size:.9rem;margin-top:10px}
.leader{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.leader:first-of-type{border-top:0}
@media (min-width:560px){.leader{grid-template-columns:1.4fr 1fr 1fr auto;align-items:center}}
</style>
</head>

async function loadAll(){
  const uidMe = myId();
  const {data: me, error} = await sb.from("profiles").select("*").eq("id", uidMe).maybeSingle();
  if (error) { S.phase = "error"; render(); return; }
  S.me = me || {id:uidMe, role:"pending", display_name:"", unit:""};
  if (S.me.role === "pending") { S.phase = "pending"; render(); return; }
  const [items, flags, sums, profs] = await Promise.all([
    sb.from("items").select("id,kind,data"),
    sb.from("flags").select("*").order("created_on",{ascending:false}),
    sb.from("summaries").select("*"),
    sb.from("profiles").select("id,display_name,role,unit,email,created_at")
  ]);
  if (items.error) { S.phase = "error"; render(); return; }
  S.items.clear(); (items.data||[]).forEach(r => S.items.set(r.id, {...r.data, id:r.id, kind:r.kind}));
  S.flags = flags.data || [];
  S.summaries.clear(); (sums.data||[]).forEach(r => S.summaries.set(r.owner, r));
  S.profiles.clear(); (profs.data||[]).forEach(p => S.profiles.set(p.id, p));
  const mine = S.summaries.get(uidMe); S.lastSummary = mine ? JSON.stringify(mine.data) : null;
  const sl = settings().lang; if (sl && sl !== S.lang) setLang(sl);
  S.phase = "app"; render();
  if (!mine && members().length) scheduleSummary();
}
async function refreshShared(){
  if (S.phase !== "app") return;
  const [flags, sums, profs] = await Promise.all([
    sb.from("flags").select("*").order("created_on",{ascending:false}),
    sb.from("summaries").select("*"),
    sb.from("profiles").select("id,display_name,role,unit,email,created_at")
  ]);
  if (!flags.error) S.flags = flags.data || [];
  if (!sums.error) { S.summaries.clear(); (sums.data||[]).forEach(r => S.summaries.set(r.owner, r)); }
  if (!profs.error) { S.profiles.clear(); (profs.data||[]).forEach(p => S.profiles.set(p.id, p)); const me = S.profiles.get(myId()); if (me) S.me = {...S.me, ...me}; }
  render();
}
async function save(item){
  const clean = JSON.parse(JSON.stringify(item));
  const {id, kind, ...data} = clean;
  S.items.set(id, clean); render();
  const {error} = await sb.from("items").upsert({owner: myId(), id, kind, data, updated_at: new Date().toISOString()});
  if (error) toast(t("errSave")); else scheduleSummary();
}
async function remove(id){
  S.items.delete(id); render();
  const {error} = await sb.from("items").delete().eq("id", id).eq("owner", myId());
  if (error) toast(t("errDel")); else scheduleSummary();
}
function buildSummary(){
  const st = settings(), ms = members();
  return {
    household: st.household || "", memberCount: ms.length, clpCount: ms.filter(m=>m.clp).length,
    lastContacts: ms.map(m => lastContact(m)),
    meetings: meetings().slice(0,12).map(mt => ({date: mt.date || "", attended: (mt.attendees||[]).filter(id=>S.items.has(id)).length}))
  };
}
function scheduleSummary(){ clearTimeout(S.sumTimer); S.sumTimer = setTimeout(writeSummary, 1500); }
async function writeSummary(){
  const next = buildSummary(), json = JSON.stringify(next);
  if (json === S.lastSummary) return;
  const {error} = await sb.from("summaries").upsert({owner: myId(), data: next});
  if (!error) S.lastSummary = json;
}

/* ---------------- care status ---------------- */
function lastContact(m){ const ds = (m.notes||[]).map(n=>n.date).filter(Boolean).sort(); return ds.length ? ds[ds.length-1] : null; }
function care(m){
  const d = daysSince(lastContact(m));
  if (d === null) return {cls:"late", label:t("noContact"), color:"var(--rust)", frac:0, d};
  if (d <= 14) return {cls:"ok", label: d===0?t("today"):t("dAgo",d), color:"var(--sage)", frac:1 - d/30, d};
  if (d <= 30) return {cls:"due", label:t("dAgo",d), color:"var(--gold)", frac:Math.max(.08,1 - d/30), d};
  return {cls:"late", label:t("dAgo",d), color:"var(--rust)", frac:.04, d};
}
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
function ring(m){
  const c = care(m), r = 22, Lc = 2*Math.PI*r;
  return `<div class="ring" aria-hidden="true"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="4"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${c.color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${Lc*c.frac} ${Lc}"/></svg><span>${esc(initials(m.name))}</span></div>`;
}
function attendance(m){
  const past = meetings().filter(x => x.date && x.date <= today());
  const att = past.filter(x => (x.attendees||[]).includes(m.id)).length;
  return {att, total: past.length, pct: past.length ? Math.round(att/past.length*100) : null};
}

/* ---------------- celebrations ---------------- */
function nextOccurrence(dateStr){
  if (!dateStr) return null;
  const [, mo, da] = dateStr.split("-").map(Number); if (!mo || !da) return null;
  const now = new Date(today() + "T12:00:00");
  let n = new Date(now.getFullYear(), mo-1, da, 12);
  if (n < now) n = new Date(now.getFullYear()+1, mo-1, da, 12);
  return {days: Math.round((n - now)/864e5), year: n.getFullYear()};
}
function celebrations(withinDays = 30){
  const out = [];
  members().forEach(m => {
    const add = (date, kind, who) => {
      const o = nextOccurrence(date); if (!o || o.days > withinDays) return;
      const born = Number((date||"").slice(0,4));
      out.push({m, kind, who, days:o.days, date, years: kind === "anniv" && born > 1900 && born < o.year ? o.year - born : null});
    };
    add(m.birthday, "bday", m.name);
    if (m.spouse) add(m.spouseBirthday, "bday", m.spouse);
    add(m.anniversary, "anniv", coupleName(m));
  });
  return out.sort((a,b)=>a.days-b.days);
}

const greeting = c => c.kind === "bday" ? t("greetBday", c.who) : t("greetAnniv", c.who, c.years);

function renderTabs(){
  const nav = document.querySelector("nav.tabs");
  if (S.phase !== "app") { nav.hidden = true; return; }
  nav.hidden = false;
  const openForMe = isOverseer() ? S.flags.filter(f=>f.sender!==myId() && f.status==="open").length : 0;
  const tabs = [["flock",t("tabFlock")],["meetings",t("tabMeet")],["topics",t("tabTopics")],["flags",t("tabFlags")]];
  if (isOverseer()) tabs.push(["chapter", role()==="chapter"?t("tabChapter"):t("tabUnit")]);
  if (role() === "admin") tabs.push(["leaders", t("tabLeaders")]);
  tabs.push(["more",t("tabExport")]);
  const el = $("#tabs"); el.style.gridTemplateColumns = `repeat(${tabs.length},1fr)`;
  el.innerHTML = tabs.map(([k,l]) => `<button data-tab="${k}" ${S.view===k||(k==="flock"&&S.view==="member")?'aria-current="page"':""}>${ICONS[k]}${esc(l)}${k==="flags"&&openForMe?`<span class="badge">${openForMe}</span>`:""}</button>`).join("");
}

  return headerBlock(t("hhMeetings"), nextHost?esc(t("nextHost",nextHost.name)):t("rotate"), `<button class="btn primary" data-act="add-meeting" ${members().length?"":"disabled"}>${t("schedule")}</button>`)

function fmtTime(tm){ const [h,mi]=tm.split(":").map(Number); const d=new Date(); d.setHours(h,mi); return d.toLocaleTimeString(LOCALE[S.lang],{hour:"numeric",minute:"2-digit"}); }
function suggestHost(){
  const ms = members(); if (!ms.length) return null;
  const last = {}; meetings().forEach(mt => { if (mt.hostId && (!last[mt.hostId] || mt.date > last[mt.hostId])) last[mt.hostId] = mt.date; });
  return [...ms].sort((a,b)=>(last[a.id]||"").localeCompare(last[b.id]||""))[0];
}
function reminderText(mt){
  const host = S.items.get(mt.hostId);
  const place = host ? t("placeHome", host.name) : mt.venue ? t("placeVenue", mt.venue) : t("placeTBD");
  return t("reminder", fmtDate(mt.date), mt.time ? fmtTime(mt.time) : "", place, host?.address || "", mt.topic || "");
}

function hhStats(sid, s){
  const fu = (s.lastContacts||[]).filter(d => { const x = daysSince(d); return x === null || x > 30; }).length;
  const past = (s.meetings||[]).filter(m=>m.date && m.date<=today()).sort((a,b)=>b.date.localeCompare(a.date));
  const last3 = past.slice(0,3);
  const attPct = last3.length && s.memberCount ? Math.round(last3.reduce((x,m)=>x+Math.min(m.attended,s.memberCount),0) / (last3.length*s.memberCount) * 100) : null;
  const next = (s.meetings||[]).filter(m=>m.date && m.date>today()).map(m=>m.date).sort()[0];
  const flags = S.flags.filter(f=>f.sender===sid && f.status==="open").length;
  return {fu, attPct, lastMeet: past[0]?.date, next, flags};
}

  let body = "";
  if (!rows.length) body = `<div class="empty"><strong>${t("chEmptyT")}</strong>${t("chEmptyB")}</div>`;
  else {
    const totM = rows.reduce((x,r)=>x+r.s.memberCount,0), totClp = rows.reduce((x,r)=>x+r.s.clpCount,0), totFu = rows.reduce((x,r)=>x+r.k.fu,0);
    const attRows = rows.filter(r=>r.k.attPct!==null);
    const avgAtt = attRows.length ? Math.round(attRows.reduce((x,r)=>x+r.k.attPct*r.s.memberCount,0)/attRows.reduce((x,r)=>x+r.s.memberCount,0)) : null;
    const openFlags = S.flags.filter(f=>f.status==="open").length;

    const hhRow = r => {

      return `<div class="hh"><div class="spread"><div><strong>${esc(r.s.household || t("yourHH"))}</strong><div class="small muted">${esc(personName(r.id))} · ${t("nMembers", r.s.memberCount)} · CLP ${t("ofMembers", r.s.clpCount, r.s.memberCount)}</div></div>

        ${r.k.attPct!==null?`<div class="bar"><i style="width:${r.k.attPct}%"></i></div><div class="small muted">${t("cAtt")}: ${r.k.attPct}%</div>`:""}</div>`;

function offerFile(filename, data, mime){

  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;

  members().forEach(m => { const a=attendance(m); rows.push([m.name,m.spouse,m.household,m.clp?"Yes":"No",m.clpYear,(m.formation||[]).map(f=>`${f.name} (${f.date})`).join("; "),a.att,a.total,a.pct??"",lastContact(m)||""]); });

async function restore(file){
  try {
    const arr = JSON.parse(await file.text());
    if (!Array.isArray(arr)) throw 0;
    const rows = arr.filter(x => x && typeof x.id === "string" && ["member","meeting","topic","settings"].includes(x.kind))
      .map(x => { const {id, kind, ...data} = x; return {owner: myId(), id, kind, data, updated_at: new Date().toISOString()}; });
    if (!rows.length) throw 0;
    for (let i = 0; i < rows.length; i += 200) { const {error} = await sb.from("items").upsert(rows.slice(i, i+200)); if (error) throw error; }
    rows.forEach(r => S.items.set(r.id, {...r.data, id:r.id, kind:r.kind}));
    render(); scheduleSummary(); toast(t("restored", rows.length));
  } catch(e){ toast(t("errRestore")); }
}

/* ---------------- events ---------------- */
document.addEventListener("submit", async e => {
  if (e.target.id !== "authForm") return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  S.authErr = ""; S.authMsg = "";
  if (S.authMode === "signup") {
    const {data, error} = await sb.auth.signUp({email:d.email.trim(), password:d.password, options:{data:{display_name:(d.name||"").trim()}}});
    if (error) { S.authErr = t("errSignup"); render(); return; }
    if (!data.session) { S.authMsg = t("checkEmail"); S.authMode = "signin"; render(); }
  } else {
    const {error} = await sb.auth.signInWithPassword({email:d.email.trim(), password:d.password});
    if (error) { S.authErr = t("errAuth"); render(); }
  }
});
document.addEventListener("click", e => {
  const el = e.target.closest("button,input[type=checkbox]"); if (!el) return;
  const m = S.items.get(S.memberId), ds = el.dataset;
  if (ds.tab) { S.view = ds.tab; render(); scrollTo(0,0); if (ds.tab==="flags"||ds.tab==="chapter"||ds.tab==="leaders") refreshShared(); return; }
  if (ds.nav) { S.view = ds.nav; render(); return; }
  if (ds.open) { S.memberId = ds.open; S.view = "member"; render(); scrollTo(0,0); return; }
  if (ds.meet) { meetingForm(S.items.get(ds.meet)); return; }
  if (ds.topic) { topicForm(S.items.get(ds.topic)); return; }
  if (ds.greet) { const c = celebrations()[+ds.greet]; if (c) copyText(greeting(c), t("greetCopied")); return; }
  if (ds.ftab) { S.flagTab = ds.ftab; render(); return; }
  if (ds.ack) { respondForm(ds.ack, "ack"); return; }
  if (ds.resolve) { respondForm(ds.resolve, "resolved"); return; }
  if (ds.saveLeader) { saveLeader(ds.saveLeader); return; }
  if (ds.delNote && m) { if (confirm(t("confirmDelNote"))) save({...m, notes:m.notes.filter(n=>n.id!==ds.delNote)}); return; }
  if (ds.delForm && m) { save({...m, formation:m.formation.filter(n=>n.id!==ds.delForm)}); return; }
  if (ds.pray && m) { save({...m, prayer:m.prayer.map(p=>p.id===ds.pray?{...p,answered:el.checked}:p)}); return; }
  switch (ds.act) {
    case "add-member": memberForm(); break;
    case "edit-member": memberForm(m); break;
    case "settings": settingsForm(); break;
    case "add-note": noteForm(m); break;
    case "add-prayer": prayerForm(m); break;
    case "add-formation": formationForm(m); break;
    case "flag": flagForm(m); break;
    case "delete-member": if (confirm(t("confirmRemove", m.name))) { remove(m.id); S.view="flock"; toast(t("mRemoved")); } break;
    case "add-meeting": meetingForm(); break;
    case "add-topic": topicForm(); break;
    case "csv": csv(); break;
    case "json": backup(); break;
    case "refresh": refreshShared(); break;
    case "reload": location.reload(); break;
    case "signout": sb.auth.signOut(); break;
    case "authswitch": S.authMode = S.authMode==="signup"?"signin":"signup"; S.authErr=""; S.authMsg=""; render(); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.matches("select[data-lang]")) { const l = e.target.value; setLang(l); if (S.phase === "app") save({...settings(), lang:l}); }
  if (e.target.id === "restoreFile" && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshShared(); });

/* ---------------- start ---------------- */
document.documentElement.lang = S.lang === "tl" ? "fil" : S.lang;
render();
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    const prev = S.session?.user?.id;
    S.session = session;
    if (!session) { S.phase = "auth"; S.items.clear(); S.flags = []; S.summaries.clear(); S.profiles.clear(); S.me = null; S.view = "flock"; render(); return; }
    if (session.user.id !== prev || S.phase === "auth" || S.phase === "loading") { S.phase = "loading"; render(); setTimeout(loadAll, 0); }
  });
}
})();
</script>
</body>
</html>
